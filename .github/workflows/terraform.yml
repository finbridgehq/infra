name: Terraform validation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.x"

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive

  validate:
    name: Validate ${{ matrix.layer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer:
          - base
          - core
          - data
          - apps
          - functions
          - messaging

    defaults:
      run:
        working-directory: terraform/${{ matrix.layer }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.x"

      - name: Initialize without a remote backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate configuration
        run: terraform validate -no-color
